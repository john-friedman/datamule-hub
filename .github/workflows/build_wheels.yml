name: Build and Upload to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build ${{ matrix.name }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
            macos_environment: ""
          - name: windows-x86_64
            os: windows-latest
            arch: AMD64
            macos_environment: ""
          - name: macos-x86_64
            os: macos-15-intel
            arch: x86_64
            macos_environment: MACOSX_DEPLOYMENT_TARGET=10.12
          - name: macos-arm64
            os: macos-latest
            arch: arm64
            macos_environment: MACOSX_DEPLOYMENT_TARGET=11.0

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set package version from tag
        shell: python
        run: |
          import os
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"DATAMULE_VERSION={version}\n")

      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build wheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS: ${{ matrix.macos_environment }}

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set package version from tag
        run: echo "DATAMULE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v6
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          name: source-distribution
          path: dist

      - name: Validate distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --verbose dist/*
